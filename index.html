<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2342">
<title> نادر لصيانة معدات STILL الكهربائيه</title>
  <meta property="og:title" content="نادر لصيانة معدات STILL الكهربائية">
  <meta property="og:description" content="دليل صيانة وخدمة اللوادر و المعدات الكهربائية ماركة STILL.">
  <meta property="og:image" content="اسم_الصورة_التي_رفعتها.jpg">
  <meta property="og:url" content="رابط_موقعك_على_جيثب">
  <meta property="og:type" content="website">

<style>
:root{--navy:#0a2342;--orange:#f58220;--panel-h:156px;
 --sw:min(100vw,calc((100dvh - var(--panel-h)) * .5586));--u:calc(var(--sw)/100)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#17406f,#07162b);font-family:"Cairo","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.col{width:var(--sw);position:relative}
.stage{position:relative;width:100%;aspect-ratio:572/1024;overflow:hidden;background:#cfe6f5}
.world{position:absolute;inset:0;transform-origin:50% 40%;transform:scale(1.08)}
.world img{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%}
.veh{position:absolute;opacity:0}
.veh img{width:100%;height:100%;position:relative}
.pitch{position:absolute;inset:0}
.fork{left:22%;top:35.8%;width:98.95%;aspect-ratio:553/586}
.truck{left:-1.4%;top:53.5%;width:52.4%;aspect-ratio:289/375}
.fork .pitch{transform-origin:72% 94%}.truck .pitch{transform-origin:60% 94%}
.shadow{position:absolute;bottom:1%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45),rgba(0,0,0,0));filter:blur(2px)}
.fork .shadow{left:22%;width:78%}.truck .shadow{left:2%;width:92%}
.ring{position:absolute;bottom:0;height:11%;border-radius:50%;border:calc(var(--u)*.5) solid rgba(90,210,255,.95);box-shadow:0 0 calc(var(--u)*3) rgba(90,210,255,.9);opacity:0;transform:scale(.2)}
.fork .ring{left:25%;width:70%}.truck .ring{left:5%;width:85%}
.beacon{position:absolute;left:70.5%;top:7.7%;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,1),rgba(255,160,40,0) 68%);mix-blend-mode:screen;opacity:0}
.bubble{position:absolute;background:#fff;color:var(--navy);padding:.35em .75em;border-radius:1.1em;font-size:calc(var(--u)*3.7);font-weight:800;white-space:nowrap;transform:scale(0);box-shadow:0 calc(var(--u)*.5) calc(var(--u)*2) rgba(0,0,0,.25);z-index:3}
.bubble::after{content:"";position:absolute;bottom:-.55em;left:1.1em;border:.6em solid transparent;border-top-color:#fff;border-bottom:0}
.fork .bubble{top:-9%;left:46%;transform-origin:20% 120%}
.truck .bubble{top:-13%;left:12%;transform-origin:20% 120%}
/* الفني: فوق اللوادر */
.man{position:absolute;height:69.9%;top:25%}
.manA{left:24.65%;width:47.7%}
.manB{left:26.92%;width:42.1%;opacity:0}
.flash{position:absolute;left:50%;top:44%;width:80%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.4);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 65%);opacity:0;mix-blend-mode:screen;pointer-events:none}
.shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);transform:translateX(-100%)}
.badge{position:absolute;top:1.8%;left:50%;transform:translateX(-50%) translateY(-60%);opacity:0;background:rgba(10,35,66,.88);color:#fff;font-size:calc(var(--u)*3.2);font-weight:700;padding:.45em 1.1em;border-radius:99px;border:1px solid rgba(245,130,32,.9);white-space:nowrap;z-index:4}
.badge b{color:var(--orange);letter-spacing:.08em}
.panel{height:var(--panel-h);background:linear-gradient(180deg,#0d2c52,var(--navy));border-top:calc(var(--u)*.7) solid var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.9);padding:0 calc(var(--u)*4);text-align:center}
h1{font-size:calc(var(--u)*5.6);font-weight:800;line-height:1.25;opacity:0;transform:translateY(40%)}
h1 .still{color:var(--orange);letter-spacing:.06em}
.sub{font-size:calc(var(--u)*3.1);color:#bcd2ea;opacity:0;transform:translateY(40%)}
.enter{font:inherit;font-size:calc(var(--u)*4.2);font-weight:800;color:#fff;border:0;cursor:pointer;background:linear-gradient(180deg,#ff9a3c,var(--orange));padding:.55em 2.2em;border-radius:99px;opacity:0;transform:translateY(40%);box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(245,130,32,.35)}
.bar{width:calc(var(--u)*36);height:calc(var(--u)*.7);background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;opacity:0}
.bar i{display:block;height:100%;background:var(--orange);transform-origin:right;transform:scaleX(0)}
.replay{position:absolute;top:8%;left:2.5%;z-index:6;border:0;border-radius:99px;background:rgba(255,255,255,.88);color:var(--navy);font:inherit;font-size:calc(var(--u)*3);font-weight:700;padding:.35em .9em;cursor:pointer}
.toast{position:absolute;left:50%;bottom:calc(var(--panel-h) + var(--u)*3);transform:translateX(-50%) scale(.9);opacity:0;background:#fff;color:var(--navy);font-weight:700;font-size:calc(var(--u)*3.4);padding:.6em 1.2em;border-radius:12px;z-index:9;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) scale(1)}
/* التوقيت */
.play .world{animation:kb 6.5s cubic-bezier(.2,.6,.2,1) both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.play .shine{animation:shine 1.5s .5s ease-in-out both}
@keyframes shine{0%{opacity:0;transform:translateX(-100%)}15%,85%{opacity:.8}100%{opacity:0;transform:translateX(100%)}}
.play .badge{animation:drop .6s .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.play .fork{animation:fkIn 2.1s 1.2s cubic-bezier(.12,.75,.2,1) both}
@keyframes fkIn{0%{opacity:1;transform:translateX(112%)}100%{opacity:1;transform:translateX(0)}}
.play .truck{animation:trIn 1.9s 1.9s cubic-bezier(.12,.75,.2,1) both}
@keyframes trIn{0%{opacity:1;transform:translateX(-125%)}100%{opacity:1;transform:translateX(0)}}
.play .fork .pitch{animation:nod .8s 3.3s ease-in-out both,hop 1s 4.1s ease-in-out both}
.play .truck .pitch{animation:sway 1s 3.8s ease-in-out both,hop 1s 4.7s ease-in-out both}
@keyframes nod{0%{transform:rotate(0)}30%{transform:rotate(-2deg) translateY(.6%)}65%{transform:rotate(.8deg)}100%{transform:rotate(0)}}
@keyframes sway{0%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}55%{transform:rotate(2deg)}80%{transform:rotate(-.8deg)}100%{transform:rotate(0)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}22%{transform:scale(1.02,.97)}45%{transform:translateY(-2.5%) scale(.985,1.02)}70%{transform:translateY(0) scale(1.02,.98)}}
.play .beacon{animation:blink .45s 3.3s 6 steps(1,end) both}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.play .fork .ring{animation:ring 1.1s 3.3s ease-out both}
.play .truck .ring{animation:ring 1.1s 3.8s ease-out both}
@keyframes ring{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(1.4)}}
.play .fork .bubble{animation:pop 1.9s 3.35s both}
.play .truck .bubble{animation:pop 1.7s 3.85s both}
@keyframes pop{0%{transform:scale(0)}12%{transform:scale(1.15)}20%,80%{transform:scale(1)}100%{transform:scale(0)}}
/* الفني يكتف إيديه */
.play .manA{animation:hideA .01s 5s both}
@keyframes hideA{to{opacity:0}}
.play .manB{animation:showB .25s 4.95s both}
@keyframes showB{0%{opacity:0;transform:scale(.985)}100%{opacity:1;transform:scale(1)}}
.manB{transform-origin:50% 100%}
.play .flash{animation:flash .5s 4.9s ease-out both}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:.8}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
.play h1{animation:up .7s 3.4s cubic-bezier(.2,.9,.3,1) both}
.play .sub{animation:up .7s 3.9s cubic-bezier(.2,.9,.3,1) both}
.play .enter{animation:up .7s 4.4s cubic-bezier(.2,.9,.3,1) both,pulse 1.8s 5.2s ease-in-out infinite}
.play .bar{animation:fade .4s 5.2s both}
.play .bar i{animation:fill var(--auto,9s) 5.2s linear both}
@keyframes up{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,130,32,.55)}60%{box-shadow:0 0 0 calc(var(--u)*3) rgba(245,130,32,0)}}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="col" id="col">
 <div class="stage">
  <div class="world">
   <img class="bg" src="img/plate.jpg" alt="">
   <div class="veh truck"><span class="shadow"></span><span class="ring"></span><div class="pitch"><img src="img/truck.png" alt=""></div><b class="bubble">بيب! 👋</b></div>
   <div class="veh fork"><span class="shadow"></span><span class="ring"></span><div class="pitch"><img src="img/forklift.png" alt=""><i class="beacon"></i></div><b class="bubble">بيب بيب ⚡</b></div>
   <img class="man manA" src="img/man_down.png" alt="فني صيانة Still">
   <img class="man manB" src="img/man_cross.png" alt="">
   <div class="flash"></div>
  </div>
  <div class="shine"></div>
  <div class="badge"><b>STILL</b> · مركز صيانة معتمد</div>
  
 </div>
 <div class="panel">
  <h1>صيانة لوادر <span class="still">STILL</span> الكهربائية</h1>
  <p class="sub">فنيين معتمدين • قطع غيار أصلية • خدمة سريعة</p>
  <button class="enter" id="enter">ادخل الموقع</button>
  <div class="bar"><i></i></div>
 </div>
 <div class="toast" id="toast">هنا هيفتح الموقع الرئيسي</div>
</div>
<script>
const ENTER_URL="home.html";   // صفحة الموقع الرئيسية
const AUTO_ENTER_MS=4000; // الدخول التلقائي بعد ظهور الزرار (0 = إيقاف)
const col=document.getElementById('col');let timer;
function go(){if(!ENTER_URL){const t=document.getElementById('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);return}
 document.body.style.transition='opacity .4s';document.body.style.opacity=0;setTimeout(()=>location.href=ENTER_URL,380)}
function start(){clearTimeout(timer);col.classList.remove('play');void col.offsetWidth;
 col.style.setProperty('--auto',(AUTO_ENTER_MS||9000)/1000+'s');col.classList.add('play');
 if(AUTO_ENTER_MS)timer=setTimeout(go,5200+AUTO_ENTER_MS)}
document.getElementById('enter').addEventListener('click',go);
const r=document.getElementById('replay');if(r)r.addEventListener('click',start);
Promise.all([...document.images].map(i=>i.decode?i.decode().catch(()=>{}):0)).then(start);
</script>
</body>
</html>
